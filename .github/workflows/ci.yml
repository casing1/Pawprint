name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes anything.
permissions:
  contents: read

jobs:
  build:
    # macos-15, not macos-14. The Observation macro on the macos-14 image emits a duplicate
    # modifier for any `package` stored property it tracks, which is a build failure — the source
    # is valid Swift and compiles on a current toolchain. The deployment target is set in
    # Package.swift (.macOS(.v14)) and is unaffected by which image builds it.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build (debug)
        run: swift build -c debug

      - name: Build (release)
        run: swift build -c release

      - name: Test
        run: swift test

      # Run again, and in timezones that are not the machine's. The suite is meant to be
      # deterministic, and the way it first failed to be was a day-boundary test that quietly
      # depended on the host being in Seoul.
      - name: Test again, in other timezones
        run: |
          set -euo pipefail
          for tz in UTC America/New_York Pacific/Kiritimati; do
            echo "--- TZ=$tz"
            TZ=$tz swift test
          done

      - name: Reject a hostile release tag
        run: ./scripts/test_validate_tag.sh

      - name: Check the workflows
        run: python3 scripts/check_workflows.py

      - name: Package
        # Proves the whole bundling path still works, not just that the code compiles.
        run: ./scripts/build_app.sh release

      # Nothing from the development tooling may reach what people install.
      - name: Confirm the release build has no debug tooling in it
        run: |
          set -euo pipefail
          BINARY=build/Pawprint.app/Contents/MacOS/Pawprint
          for symbol in PAWPRINT_ DebugSnapshot DemoData DebugCommand; do
            if strings "$BINARY" | grep -q "$symbol"; then
              echo "::error::'$symbol' is present in the release binary"
              exit 1
            fi
          done
          echo "no debug tooling in the release binary"

      - name: Confirm the binary is universal
        run: |
          set -euo pipefail
          ARCHS=$(lipo -archs build/Pawprint.app/Contents/MacOS/Pawprint)
          echo "archs: $ARCHS"
          for want in arm64 x86_64; do
            case " $ARCHS " in
              *" $want "*) ;;
              *) echo "::error::$want missing from the built binary"; exit 1 ;;
            esac
          done

      # Everything a release does short of signing, which needs secrets a pull request cannot see.
      - name: Package a disk image
        run: |
          set -euo pipefail
          ./scripts/make_dmg.sh
          ls -la dist/

      # A debug bundle, because that is where the probes now live. The release build above is
      # what ships and deliberately contains none of this.
      - name: Build a debug bundle for the probes
        run: ./scripts/build_app.sh debug

      # These reach paths a unit test cannot, because they need a running application: the loaded
      # language pack, the item catalogue, the record rewards.
      - name: Run the in-app probes
        run: |
          set -euo pipefail
          APP=build/Pawprint.app/Contents/MacOS/Pawprint
          for probe in PAWPRINT_L10N PAWPRINT_ITEMS PAWPRINT_REWARDS PAWPRINT_CHAOS \
                       PAWPRINT_SESSIONS PAWPRINT_STREAK PAWPRINT_FACTS; do
            echo "--- $probe"
            if ! env "$probe=1" "$APP"; then
              echo "::error::$probe failed"
              exit 1
            fi
          done

      # Every offered language must resolve every key it is asked for. A pack that is merely
      # complete can still be wrong: this loads each one into a running application.
      - name: Check every language pack in a running app
        run: |
          set -euo pipefail
          APP=build/Pawprint.app/Contents/MacOS/Pawprint
          for lang in ko en ja de; do
            echo "--- $lang"
            if ! env "PAWPRINT_LANG_PROBE=$lang" "$APP"; then
              echo "::error::the $lang pack failed"
              exit 1
            fi
          done

      # The summary is meant to be a function of the day it describes. It was not: six figures were
      # chosen with `max` over a dictionary, so on a day where two things tied the answer changed
      # between launches. Running the same digest twice is what would catch that coming back.
      - name: Confirm the statistics are deterministic
        run: |
          set -euo pipefail
          APP=build/Pawprint.app/Contents/MacOS/Pawprint
          export PAWPRINT_DB="$RUNNER_TEMP/determinism.sqlite3"
          export PAWPRINT_DIGEST_SEED=1
          env PAWPRINT_DIGEST=all "$APP" > "$RUNNER_TEMP/first.txt" 2>&1
          env PAWPRINT_DIGEST=all "$APP" > "$RUNNER_TEMP/second.txt" 2>&1
          if ! diff "$RUNNER_TEMP/first.txt" "$RUNNER_TEMP/second.txt"; then
            echo "::error::the same database produced different statistics on two runs"
            exit 1
          fi
          echo "the statistics are the same twice"

      # A day's record must never grow a field that could hold what was typed, seen or copied.
      # The unit tests check the model; this checks what the running application actually writes.
      - name: Confirm no forbidden field reached the stored format
        run: |
          set -euo pipefail
          FORBIDDEN='"text"|"characters"|"clipboardContent"|"windowTitle"|"documentName"|"url"|"screenshot"|"path"|"cursorPath"'
          if grep -rEn "case ($FORBIDDEN)" Sources/PawprintCore/Models/DailyRawCounters.swift; then
            echo "::error::a forbidden field appeared in the stored day format"
            exit 1
          fi
          echo "the stored format holds counts and durations only"
