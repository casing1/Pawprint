name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -c release
      - name: Package
        # Proves the whole bundling path still works, not just that the code compiles.
        run: ./scripts/build_app.sh release
