name: Announcements

# Publishes open, labelled issues as the app's announcement feed.
#
# The app deliberately does *not* call the issues API itself. Unauthenticated GitHub API access is
# 60 requests per hour **per IP**, and conditional requests do not help — a 304 still decrements
# the counter (measured, not assumed). Behind a shared NAT, a few dozen installs would exhaust the
# quota for everybody on it, breaking announcements *and* the update check, with no visible cause.
#
# So this workflow reads the issues once, with the runner's own token, and writes the result to a
# static file served by raw.githubusercontent.com — a CDN with no such limit. The authoring
# workflow is unchanged from calling the API live: open an issue to publish, close it to retract.
# The only cost is the half-minute this takes to run.

on:
  issues:
    types: [opened, edited, deleted, closed, reopened, labeled, unlabeled]
  workflow_dispatch:
  # A safety net: if an `issues` event is ever missed, the feed is at most a day stale.
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write
  issues: read

concurrency:
  group: announcements
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the feed from open announcement issues
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: python3 scripts/build_announcements.py

      - name: Commit if it changed
        run: |
          if git diff --quiet -- docs/announcements.json; then
            echo "feed unchanged"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/announcements.json
          git commit -m "Update announcement feed"
          git push
