name: Announcements

# Publishes open, labelled issues as the app's announcement feed.
#
# The app deliberately does *not* call the issues API itself. Unauthenticated GitHub API access is
# 60 requests per hour **per IP**, and conditional requests do not help — a 304 still decrements
# the counter (measured, not assumed). Behind a shared NAT, a few dozen installs would exhaust the
# quota for everybody on it, breaking announcements *and* the update check, with no visible cause.
#
# So this workflow reads the issues once, with the runner's own token, and writes the result to a
# static file served by raw.githubusercontent.com — a CDN with no such limit. The authoring
# workflow is unchanged from calling the API live: open an issue to publish, close it to retract.
# The cost is propagation delay — this run plus up to 5 minutes of CDN caching, measured at about
# six minutes end to end.

on:
  issues:
    types: [opened, edited, deleted, closed, reopened, labeled, unlabeled]
  workflow_dispatch:
  # A safety net: if an `issues` event is ever missed, the feed is at most a day stale.
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write
  issues: read

concurrency:
  group: announcements
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Regenerated inside the retry loop rather than once up front. Opening an issue with two
      # labels fires three `issues` events at nearly the same instant; the concurrency group stops
      # them running at once, but a run can still check out before the previous one's push lands
      # and then be rejected as non-fast-forward. Rebuilding from the live API on each attempt
      # means whichever run pushes last has read the current state, so the feed is correct by
      # construction instead of by luck.
      - name: Build the feed and publish it
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch --quiet origin "${GITHUB_REF_NAME:-main}"
            git reset --quiet --hard "origin/${GITHUB_REF_NAME:-main}"

            python3 scripts/build_announcements.py

            if git diff --quiet -- docs/announcements.json; then
              echo "feed unchanged"
              exit 0
            fi

            git add docs/announcements.json
            git commit -q -m "Update announcement feed"
            if git push --quiet; then
              echo "published on attempt $attempt"
              exit 0
            fi
            echo "push rejected, retrying"
            sleep $(( attempt * 3 ))
          done

          echo "::error::could not publish the announcement feed after 3 attempts"
          exit 1
