name: Release

# Publishing is driven by tags: `scripts/release.sh 0.2.0` bumps the version, tags, and pushes,
# and everything below runs from that tag. `workflow_dispatch` exists so a release can be retried
# without inventing a new version number.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)publish, e.g. v0.2.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    # macos-15, not macos-14. The Observation macro on the macos-14 image emits a duplicate
    # modifier for any `package` stored property it tracks, which is a build failure — the source
    # is valid Swift and compiles on a current toolchain. The deployment target is set in
    # Package.swift (.macOS(.v14)) and is unaffected by which image builds it.
    runs-on: macos-15
    env:
      # Hoisted to job scope because the `secrets` context is not available in a step `if`.
      CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
      CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "tag=$TAG"          >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"  >> "$GITHUB_OUTPUT"

      # The tag is the single source of truth for the version — the checked-in Info.plist is only
      # a default, so stamping it here keeps a re-tagged build from shipping a stale number.
      - name: Stamp version into Info.plist
        run: |
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ steps.version.outputs.version }}" scripts/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" scripts/Info.plist

      # macOS ties Accessibility / Input Monitoring grants to the code signature. An ad-hoc
      # signature is a hash of that exact build, so it changes every release and the user has to
      # re-grant permissions after each update. Importing a stable certificate fixes that.
      # Optional: without these secrets the build is ad-hoc signed and still works, it is just
      # less pleasant to update. See docs/RELEASING.md.
      - name: Import signing certificate
        if: env.CERTIFICATE_P12 != ''
        run: |
          KEYCHAIN=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          # Without this, codesign blocks on a keychain prompt that nobody can answer on a runner.
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"
          # Not `-v`: a self-signed certificate has no trust settings in a fresh keychain, so the
          # validity filter hides it even though it can sign perfectly well.
          security find-identity -p codesigning "$KEYCHAIN"
          NAME=$(security find-certificate -a -Z "$KEYCHAIN" | awk -F'"' '/"labl"/ {print $4; exit}')
          if [ -z "$NAME" ]; then
            echo "::error::Certificate imported but no label could be read from the keychain."
            exit 1
          fi
          echo "PAWPRINT_SIGN_IDENTITY=$NAME" >> "$GITHUB_ENV"
          echo "Signing identity: $NAME"

      - name: Build, sign and package
        env:
          PAWPRINT_UPDATE_PRIVATE_KEY: ${{ secrets.PAWPRINT_UPDATE_PRIVATE_KEY }}
        run: |
          if [ -z "$PAWPRINT_UPDATE_PRIVATE_KEY" ]; then
            echo "::error::PAWPRINT_UPDATE_PRIVATE_KEY secret is not set — in-app updates would refuse this build."
            exit 1
          fi
          ./scripts/make_dmg.sh --build
          cp "dist/Pawprint-${{ steps.version.outputs.version }}.dmg" dist/Pawprint.dmg

      # A release that quietly fell back to ad-hoc after the secrets were configured is the exact
      # failure that went unnoticed once already: it publishes fine and only bites users later,
      # when the update resets their permissions.
      - name: Confirm the release is not ad-hoc signed
        if: env.CERTIFICATE_P12 != ''
        run: |
          if codesign -dvv "build/Pawprint.app" 2>&1 | grep -q "Signature=adhoc"; then
            echo "::error::Certificate secrets are set but the app was ad-hoc signed."
            exit 1
          fi
          codesign -dvv "build/Pawprint.app" 2>&1 | grep -E "^Authority|^Signature" || true

      # Shipping arm64-only excluded every Intel Mac silently: Sequoia still runs on 2018-2020
      # models, and there the icon just gets a prohibitory badge and refuses to open. Nothing in
      # the build fails, so only a user can discover it.
      - name: Confirm the binary is universal
        run: |
          archs="$(lipo -archs build/Pawprint.app/Contents/MacOS/Pawprint)"
          echo "architectures: $archs"
          for required in arm64 x86_64; do
            case " $archs " in
              *" $required "*) ;;
              *) echo "::error::binary is missing $required (got: $archs)"; exit 1 ;;
            esac
          done

      - name: Verify the archive against the pinned public key
        run: |
          # Catches a mismatched key pair here rather than on every user's machine.
          # Searched for rather than read from a fixed path: the constant moved once already,
          # when the domain was split into PawprintCore, and this step went on "verifying" with an
          # empty key until the signature check itself failed. An empty result is now fatal here.
          PUBLIC_KEY=$(grep -rho 'static let publicKey = "[^"]*"' Sources | head -1 | cut -d'"' -f2)
          if [ -z "$PUBLIC_KEY" ]; then
            echo "::error::could not find the pinned public key in Sources"
            exit 1
          fi
          swift scripts/updatekeys.swift verify \
            "dist/Pawprint-${{ steps.version.outputs.version }}.zip" \
            "$(cat dist/Pawprint-${{ steps.version.outputs.version }}.zip.sig)" \
            "$PUBLIC_KEY"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          NOTES_FILE=$(mktemp)
          {
            echo "### Install"
            echo ""
            echo "Open \`Pawprint-$VERSION.dmg\` and drag Pawprint to Applications."
            echo ""
            echo "Already running Pawprint? It will offer this update to you automatically."
            echo ""
            echo "### Changes"
            echo ""
            PREVIOUS=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
            if [ -n "$PREVIOUS" ]; then
              git log --pretty='- %s' "$PREVIOUS..$TAG"
            else
              git log --pretty='- %s' -20 "$TAG"
            fi
          } > "$NOTES_FILE"

          # `--clobber` so a re-run of workflow_dispatch replaces assets instead of failing.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              "dist/Pawprint-$VERSION.dmg" \
              "dist/Pawprint.dmg" \
              "dist/Pawprint-$VERSION.zip" \
              "dist/Pawprint-$VERSION.zip.sig" --clobber
            gh release edit "$TAG" --notes-file "$NOTES_FILE"
          else
            gh release create "$TAG" \
              "dist/Pawprint-$VERSION.dmg" \
              "dist/Pawprint.dmg" \
              "dist/Pawprint-$VERSION.zip" \
              "dist/Pawprint-$VERSION.zip.sig" \
              --title "Pawprint $VERSION" \
              --notes-file "$NOTES_FILE"
          fi
